<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Form</title>
    <script src ="script.js"></script>
</head>

<body>
    <table>
        <tr>
            <td> Email</td>
            <td>
                <input
                type ="text"
                id="email"
                name ="email"
                placeholder="Enter your email"
                onchange="return getEmail();"
                />
            </td>
            <td><p id ="emailErr" style = "color :rgb(189, 34, 34)"></p></td>
        </tr>

        <tr>
            <td>Password</td>
            <td>
                <input
                type ="password"
                id ="password"
                name="password"
                placeholder = "enter your password"
                onkeyup ="return getPassword();"
                />
            </td>
            <td><p id ="passwordErr" style="color:rgb(174, 56, 56)"></p></td>
        </tr>
        <tr>
            <td></td>
            <td>
                <input
                type ="submit"
                name="login"
                id = "login"
                onclick ="return collect_data();"
                />
            </td>
        </tr>
        <tr>
            <td colspan="2">
                <p id="wrongCount" style="color:rgb(185, 50, 50);"></p>
            </td>
        </tr>
    </table>
</body>
</html>
